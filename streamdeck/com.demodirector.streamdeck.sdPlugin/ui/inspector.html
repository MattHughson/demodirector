<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Demo Director</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 10px 12px; background: #2d2d2d; color: #d8d8d8; font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .row { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
    label { color: #9a9a9a; }
    select { width: 100%; background: #3d3d3d; color: #d8d8d8; border: 1px solid #555; border-radius: 3px; padding: 4px; font: inherit; }
    .note { color: #9a9a9a; font-size: 11px; margin-top: 6px; }
    .warn { color: #f79009; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="row" data-for="veil" hidden><label for="slot">Veil</label><select id="slot" data-key="slot"></select></div>

  <div class="row" data-for="topic" hidden><label for="mode">Does</label>
    <select id="mode" data-key="mode">
      <option value="next">Next topic</option>
      <option value="prev">Previous topic</option>
      <option value="toggle">Show / hide current</option>
      <option value="show">Show a specific step</option>
    </select></div>
  <div class="row" data-for="topic" data-when="show" hidden><label for="index">Step</label><select id="index" data-key="index"></select></div>

  <div class="row" data-for="tab slide" hidden><label for="dir">Direction</label>
    <select id="dir" data-key="dir"><option value="next">Next</option><option value="prev">Previous</option></select></div>

  <div class="note" id="note"></div>
  <script src="inspector.js"></script>
</body>
</html>
