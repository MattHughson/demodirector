<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Demo Director</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 320px; padding: 12px; display: grid; gap: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    h1 { font-size: 14px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: var(--panel); }
    li .slot { width: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
    li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions button { flex: 1; }
    .empty { padding: 10px; text-align: center; }
    .msg { color: var(--live); font-size: 12px; min-height: 0; }
    .msg:empty { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Demo Director</h1>
    <div class="mode" role="group" aria-label="Mode">
      <button data-mode="rehearse">Rehearse</button>
      <button data-mode="live">Live</button>
    </div>
  </header>
  <ul id="veils"></ul>
  <div class="msg" id="msg"></div>
  <div class="actions">
    <button id="pick" class="primary">Pick element</button>
    <button id="reset" title="All veils on">Reset</button>
    <button id="settings">Settings</button>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
