<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Demo Director</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 320px; padding: 12px; display: grid; gap: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    h1 { font-size: 14px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: var(--panel); }
    li .slot { width: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
    li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions button { flex: 1; white-space: nowrap; padding: 6px 8px; }
    .empty { padding: 10px; text-align: center; }
    .msg { color: var(--live); font-size: 12px; min-height: 0; }
    .msg:empty { display: none; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > button { flex: 1; padding: 6px 8px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; padding: 6px 10px; background: transparent; color: var(--muted); }
    .seg button[aria-pressed=true] { background: var(--text); color: var(--bg); }
    #topicName { flex: 3; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Demo Director</h1>
    <div class="mode" role="group" aria-label="Mode">
      <button data-mode="rehearse">Rehearse</button>
      <button data-mode="live">Live</button>
    </div>
  </header>
  <section>
    <h2>Camera</h2>
    <div class="row">
      <button id="camOn" class="toggle"></button>
      <button id="camBlink" class="toggle"></button>
      <div class="seg" id="camSize"><button data-size="s">S</button><button data-size="m">M</button><button data-size="l">L</button></div>
    </div>
  </section>
  <section>
    <h2>Topic</h2>
    <div class="row">
      <button id="topicPrev" title="Previous topic">◀</button>
      <button id="topicName" class="toggle" title="Show / hide current topic"></button>
      <button id="topicNext" title="Next topic">▶</button>
    </div>
  </section>
  <section>
    <h2>Slack post</h2>
    <div class="row"><button id="slack" class="toggle"></button></div>
  </section>
  <section>
    <h2>Veils</h2>
    <ul id="veils"></ul>
  </section>
  <div class="msg" id="msg"></div>
  <div class="actions">
    <button id="pick" class="primary">Pick element</button>
    <button id="reset" title="All veils on">Reset</button>
    <button id="console" title="Open the Director console for your second screen">Console</button>
    <button id="settings">Settings</button>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
